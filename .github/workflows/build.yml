name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 轻量版：编译 + 测试 ──
  light-build:
    name: 轻量版 (no AI)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (light)
        run: swift build -c release -Xswiftc -DNO_AI

      - name: Test detection
        run: |
          swift run -c debug -Xswiftc -DNO_AI > /dev/null 2>&1 || true
          # Quick functional test via Python
          echo "项目经理：李小明 电话：13912345678 身份证：110101199001011234" > /tmp/test_input.txt
          echo "Test file created"

      - name: Package artifact
        run: |
          mkdir -p artifacts/Masker.app/Contents/MacOS
          cp .build/release/Masker artifacts/Masker.app/Contents/MacOS/
          cat > artifacts/Masker.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Masker</string>
            <key>CFBundleIdentifier</key><string>com.lezi.masker.light</string>
            <key>CFBundleName</key><string>Masker (轻量版)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - uses: actions/upload-artifact@v4
        with:
          name: Masker-轻量版
          path: artifacts/Masker.app

  # ── 完整版：编译 + 下载 AI 模型打包 ──
  full-build:
    name: 完整版 (with AI)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Python deps
        run: |
          pip3 install transformers torch huggingface-hub --quiet 2>&1 | tail -1

      - name: Build (full)
        run: swift build -c release

      - name: Download AI model from HuggingFace
        run: |
          mkdir -p ai-model
          echo "Downloading Privacy Filter model (2.6GB)..."
          huggingface-cli download openai/privacy-filter \
            --local-dir ai-model \
            --local-dir-use-symlinks False 2>&1
          echo "Model downloaded:"
          ls -lh ai-model/

      - name: Package artifact
        run: |
          mkdir -p artifacts-full/Masker.app/Contents/MacOS \
                   artifacts-full/Masker.app/Contents/Resources/ai-model \
                   artifacts-full/Masker.app/Contents/Resources/.venv
          # Binary
          cp .build/release/Masker artifacts-full/Masker.app/Contents/MacOS/
          # Scripts
          cp extract_text.py privacy_filter.py artifacts-full/Masker.app/Contents/Resources/
          # AI model
          cp ai-model/config.json artifacts-full/Masker.app/Contents/Resources/ai-model/
          cp ai-model/model.safetensors artifacts-full/Masker.app/Contents/Resources/ai-model/
          cp ai-model/tokenizer_config.json artifacts-full/Masker.app/Contents/Resources/ai-model/
          cp ai-model/tokenizer.json artifacts-full/Masker.app/Contents/Resources/ai-model/
          # Icon (if exists)
          cp masker-icon/Masker.icns artifacts-full/Masker.app/Contents/Resources/ 2>/dev/null || true
          # Info.plist
          cat > artifacts-full/Masker.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Masker</string>
            <key>CFBundleIdentifier</key><string>com.lezi.masker</string>
            <key>CFBundleName</key><string>Masker</string>
            <key>CFBundleIconFile</key><string>Masker</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - uses: actions/upload-artifact@v4
        with:
          name: Masker-完整版
          path: artifacts-full/Masker.app

  # ── 代码质量 ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck build.sh embed_icon.sh || echo "shellcheck had warnings (non-fatal)"
          else
            echo "shellcheck not available, skipping"
          fi
      - name: Check Python syntax
        run: |
          python3 -m py_compile extract_text.py || true
          python3 -m py_compile privacy_filter.py || true

name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 轻量版：编译 + 测试 ──
  light-build:
    name: 轻量版 (no AI)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install DMG tools
        run: pip3 install --break-system-packages pillow --quiet 2>&1 | tail -1 || true

      - name: Build (light)
        run: swift build -c release -Xswiftc -DNO_AI

      - name: Test detection
        run: |
          swift run -c debug -Xswiftc -DNO_AI > /dev/null 2>&1 || true
          # Quick functional test via Python
          echo "项目经理：李小明 电话：13912345678 身份证：110101199001011234" > /tmp/test_input.txt
          echo "Test file created"

      - name: Package artifact
        run: |
          mkdir -p artifacts/Masker.app/Contents/MacOS
          cp .build/release/Masker artifacts/Masker.app/Contents/MacOS/
          cat > artifacts/Masker.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Masker</string>
            <key>CFBundleIdentifier</key><string>com.lezi.masker.light</string>
            <key>CFBundleName</key><string>Masker (轻量版)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Create DMG (light)
        run: |
          bash scripts/make_dmg.sh artifacts/Masker.app artifacts/Masker-轻量版.dmg "Masker-轻量版"
          ls -lh artifacts/Masker-轻量版.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Masker-轻量版
          path: artifacts/Masker-轻量版.dmg

  # ── 完整版：编译 + 下载 AI 模型打包 ──
  full-build:
    name: 完整版 (with AI)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Cache the AI model (~2.6GB) so it's not re-downloaded on every push
      - name: Cache AI model
        id: cache-ai
        uses: actions/cache@v4
        with:
          path: ai-model/
          key: openai-privacy-filter-v1

      - name: Install Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet transformers torch huggingface-hub 2>&1 | tail -1
          .venv/bin/python -c "from huggingface_hub import snapshot_download; print('huggingface_hub OK')"

      - name: Install Pillow (for DMG background)
        run: |
          python3 -m pip install --break-system-packages Pillow --quiet 2>&1 | tail -1
          python3 -c "from PIL import Image; print('Pillow OK')"

      - name: Build (full)
        run: swift build -c release

      - name: Package artifact
        run: |
          mkdir -p artifacts-full/Masker.app/Contents/MacOS \
                   artifacts-full/Masker.app/Contents/Resources/.venv
          # Binary
          cp .build/release/Masker artifacts-full/Masker.app/Contents/MacOS/
          # Scripts (needed for runtime AI and file extraction)
          cp extract_text.py privacy_filter.py artifacts-full/Masker.app/Contents/Resources/
          # Python venv
          rsync -a .venv/ artifacts-full/Masker.app/Contents/Resources/.venv/ --exclude='__pycache__'
          # Icon
          cp masker-icon/Masker.icns artifacts-full/Masker.app/Contents/Resources/ 2>/dev/null || true
          # Info.plist
          cat > artifacts-full/Masker.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Masker</string>
            <key>CFBundleIdentifier</key><string>com.lezi.masker</string>
            <key>CFBundleName</key><string>Masker</string>
            <key>CFBundleIconFile</key><string>Masker</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Create DMG
        run: |
          bash scripts/make_dmg.sh artifacts-full/Masker.app artifacts-full/Masker.dmg "Masker"
          ls -lh artifacts-full/Masker.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Masker-完整版
          path: artifacts-full/Masker.dmg

  # ── 代码质量 ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck build.sh embed_icon.sh || echo "shellcheck had warnings (non-fatal)"
          else
            echo "shellcheck not available, skipping"
          fi
      - name: Check Python syntax
        run: |
          python3 -m py_compile extract_text.py || true
          python3 -m py_compile privacy_filter.py || true

  # ── Release：构建完成后自动创建 Release ──
  release:
    name: Create Release
    needs: [light-build, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Generate tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d-%H%M%S)
          SHA=$(git rev-parse --short HEAD)
          echo "tag=v2.0-ci-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=Build ${DATE}" >> "$GITHUB_OUTPUT"

      - name: Download light DMG
        uses: actions/download-artifact@v4
        with:
          name: Masker-轻量版
          path: release

      - name: List release files
        run: ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.release_name }}
          body: |
            ## Masker 自动构建

            - ⚡ **轻量版** (Masker-轻量版.dmg): 仅 regex 检测，零依赖，即开即用

            **SHA**: `${{ github.sha }}`
            **构建时间**: ${{ steps.tag.outputs.release_name }}

            ### 使用方式
            1. 下载 Masker-轻量版.dmg
            2. 双击打开，把 Masker.app 拖到 Applications 文件夹
            3. 如需 AI 增强检测，打开应用后在「使用指南」页点击下载模型

            ### 完整版
            完整版（含 AI 模型）因文件过大无法通过 GitHub Releases 分发。
            请从 Actions 页面下载 Masker-完整版 artifact，或运行 ./build.sh 本地构建。
          files: |
            release/Masker-轻量版.dmg
          prerelease: true

name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  # ── 轻量版：编译 + 测试 ──
  light-build:
    name: 轻量版
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install DMG tools
        run: pip3 install --break-system-packages pillow --quiet 2>&1 | tail -1 || true

      - name: Build (light)
        run: swift build -c release -Xswiftc -DNO_AI

      - name: Package artifact
        run: |
          mkdir -p artifacts/Masker.app/Contents/MacOS
          cp .build/release/Masker artifacts/Masker.app/Contents/MacOS/
          cat > artifacts/Masker.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Masker</string>
            <key>CFBundleIdentifier</key><string>com.lezi.masker.light</string>
            <key>CFBundleName</key><string>Masker (轻量版)</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Create DMG (light)
        run: |
          bash scripts/make_dmg.sh artifacts/Masker.app artifacts/Masker-轻量版.dmg "Masker-轻量版"
          ls -lh artifacts/Masker-轻量版.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Masker-轻量版
          path: artifacts/Masker-轻量版.dmg

  # ── 完整版：包含 AI 代码（不含模型，用户应用内下载） ──
  full-build:
    name: 完整版
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet transformers torch 2>&1 | tail -1

      - name: Install Pillow
        run: |
          python3 -m pip install --break-system-packages Pillow --quiet 2>&1 | tail -1

      - name: Build (full)
        run: swift build -c release

      - name: Package artifact
        run: |
          mkdir -p artifacts-full/Masker.app/Contents/MacOS \
                   artifacts-full/Masker.app/Contents/Resources/.venv
          cp .build/release/Masker artifacts-full/Masker.app/Contents/MacOS/
          cp extract_text.py privacy_filter.py artifacts-full/Masker.app/Contents/Resources/
          rsync -a .venv/ artifacts-full/Masker.app/Contents/Resources/.venv/ --exclude='__pycache__'
          cp masker-icon/Masker.icns artifacts-full/Masker.app/Contents/Resources/ 2>/dev/null || true
          cat > artifacts-full/Masker.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Masker</string>
            <key>CFBundleIdentifier</key><string>com.lezi.masker</string>
            <key>CFBundleName</key><string>Masker</string>
            <key>CFBundleIconFile</key><string>Masker</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Create DMG
        run: |
          bash scripts/make_dmg.sh artifacts-full/Masker.app artifacts-full/Masker.dmg "Masker"
          ls -lh artifacts-full/Masker.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Masker-完整版
          path: artifacts-full/Masker.dmg

  # ── 代码质量 ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck build.sh embed_icon.sh || echo "shellcheck had warnings (non-fatal)"
          else
            echo "shellcheck not available, skipping"
          fi
      - name: Check Python syntax
        run: |
          python3 -m py_compile extract_text.py || true
          python3 -m py_compile privacy_filter.py || true

  # ── Release ──
  release:
    name: Create Release
    needs: [light-build, full-build, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号计算
      - name: Generate version
        id: version
        run: |
          SHA=$(git rev-parse --short HEAD)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 手动触发：使用输入的版本号，标记为 latest
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # 自动触发：使用 rolling alpha 标签
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
            echo "release_name=Alpha Build (${SHA})" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # 自动构建时：删除旧的 alpha release（如果有）
      - name: Delete old alpha release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete alpha --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push --delete origin alpha 2>/dev/null || true

      # 生成 Release 描述
      - name: Generate release body
        id: body
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MSG=$(git log -1 --pretty=format:"%s")
            printf '## Masker %%s\n\n**%%s**\n\n### 下载\n- ⚡ 轻量版 (Masker-轻量版.dmg): 仅 regex 检测\n- 🧠 完整版 (Masker.dmg): 含 AI 代码\n\n### 使用方式\n1. 下载 .dmg\n2. 双击打开，拖到 Applications\n3. 如需 AI 检测，在「使用指南」页下载模型\n' "${{ github.event.inputs.version }}" "$MSG" > /tmp/release_body.md
          else
            MSG=$(git log -1 --pretty=format:"%s")
            DATE=$(date -u +%Y%m%d)
            printf '## Masker 自动构建 (%%s)\n\n**%%s**\n\n### 下载\n- ⚡ 轻量版 (Masker-轻量版.dmg): 仅 regex 检测，即开即用\n\n### 完整版\n如需完整版（含 AI 代码），请手动触发 workflow 并输入版本号。\n' "$DATE" "$MSG" > /tmp/release_body.md
          fi
          echo "body<<BODYEOF" >> "$GITHUB_OUTPUT"
          cat /tmp/release_body.md >> "$GITHUB_OUTPUT"
          echo "BODYEOF" >> "$GITHUB_OUTPUT"

      # 下载产物
      - name: Download light DMG
        uses: actions/download-artifact@v4
        with:
          name: Masker-轻量版
          path: release

      - name: Download full DMG (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: Masker-完整版
          path: release

      - name: List release files
        run: ls -lh release/

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: ${{ steps.body.outputs.body }}
          files: |
            release/Masker-轻量版.dmg
            release/Masker.dmg
          prerelease: ${{ steps.version.outputs.is_prerelease }}
